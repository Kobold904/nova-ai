<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
    }

    .app {
      height: 100vh;
      max-width: 800px;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #202633;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .status {
      color: #7dffb2;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      margin-bottom: 14px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .nova {
      background: #151b26;
    }

    .user {
      background: #27344a;
      margin-left: auto;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 15px;
      border-top: 1px solid #202633;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #303949;
      background: #111722;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 18px;
      cursor: pointer;
    }

    #send {
      background: white;
      color: black;
    }

    #send:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">NOVA</div>
    <div class="status" id="status">ONLINE</div>
  </header>

  <main id="chat">

    <div class="message nova">
      Hallo 👋

      Ich bin NOVA. Was möchtest du wissen?
    </div>

  </main>

  <div class="composer">

    <input
      id="input"
      type="text"
      placeholder="Nachricht an NOVA..."
      autocomplete="off"
    >

    <button id="send">➤</button>

  </div>

</div>

<script>

const WORKER_URL =
  "https://nova-api.nie-butan-9x.workers.dev/";


const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const status =
  document.getElementById("status");


function addMessage(text, type) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent =
    text;

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


async function askNova(text) {

  const response =
    await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });


  if (!response.ok) {
    throw new Error(
      "Serverfehler: " + response.status
    );
  }


  const data =
    await response.json();


  if (data.error) {
    throw new Error(data.error);
  }


  return data.reply;
}


async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) return;


  addMessage(
    text,
    "user"
  );


  input.value = "";

  send.disabled = true;

  status.textContent =
    "DENKT NACH...";


  try {

    const reply =
      await askNova(text);

    addMessage(
      reply,
      "nova"
    );

  } catch (error) {

    console.error(error);

    addMessage(
      "Fehler: " + error.message,
      "nova"
    );

  }


  status.textContent =
    "ONLINE";

  send.disabled = false;

  input.focus();
}


send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  }
);


input.focus();

</script>

</body>
</html>
