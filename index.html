<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
  height: 100vh;
}

.app {
  max-width: 800px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  border-bottom: 1px solid #202633;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 4px;
}

.status {
  color: #7dffb2;
  font-size: 12px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  padding: 13px 16px;
  margin-bottom: 16px;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  margin-left: auto;
  background: #27344a;
}

.nova {
  background: #151b26;
}

.composer {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #202633;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #303949;
  background: #111722;
  color: white;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 0 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">NOVA</div>
  <div class="status">FREE MODE</div>
</header>

<main id="chat">

  <div class="message nova">
    Hallo! Ich bin NOVA. 👋

    Ich funktioniere ohne API-Key,
    ohne Abo und ohne kostenpflichtigen KI-Dienst.

    Was möchtest du machen?
  </div>

</main>

<div class="composer">

  <input
    id="input"
    type="text"
    placeholder="Nachricht an NOVA..."
    autocomplete="off"
  >

  <button id="send">Senden</button>

</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");

/*
  NOVA MEMORY
  ----------------
  Die letzten Nachrichten werden
  auf dem Gerät gespeichert.
*/

let memory = JSON.parse(
  localStorage.getItem("nova_memory") || "[]"
);


/*
  Nachricht anzeigen
*/

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


/*
  Zufällige Antwort
*/

function random(list) {

  return list[
    Math.floor(Math.random() * list.length)
  ];

}


/*
  Rechner
*/

function calculate(text) {

  let expression = text
    .replace(/was ist/gi, "")
    .replace(/berechne/gi, "")
    .replace(/rechne/gi, "")
    .replace(/=/g, "")
    .trim();

  if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
    return null;
  }

  try {

    const result =
      Function(
        '"use strict"; return (' +
        expression +
        ')'
      )();

    if (Number.isFinite(result)) {
      return result;
    }

  } catch {}

  return null;
}


/*
  Gedächtnis
*/

function memoryAnswer(message) {

  if (
    message.includes("was habe ich gesagt") ||
    message.includes("erinnerst du dich") ||
    message.includes("was weißt du")
  ) {

    const userMessages =
      memory
        .filter(x => x.role === "user")
        .slice(-5);

    if (!userMessages.length) {

      return "Ich habe noch keine früheren Nachrichten gespeichert.";

    }

    return (
      "Ich erinnere mich an diese Nachrichten:\n\n" +
      userMessages
        .map(x => "• " + x.content)
        .join("\n")
    );
  }

  return null;
}


/*
  NOVA ENGINE
*/

function nova(text) {

  const message =
    text.toLowerCase().trim();


  /*
    MEMORY
  */

  const remembered =
    memoryAnswer(message);

  if (remembered) {
    return remembered;
  }


  /*
    BEGRÜSSUNG
  */

  if (
    /^(hallo|hi|hey|moin|servus)\b/.test(message)
  ) {

    return random([
      "Hey! 👋 Was machen wir?",
      "Hallo! Schön dich zu sehen.",
      "Hey! NOVA ist bereit. 🤖"
    ]);

  }


  /*
    IDENTITÄT
  */

  if (
    message.includes("wer bist du") ||
    message.includes("was bist du")
  ) {

    return (
      "Ich bin NOVA – deine persönliche " +
      "kostenfreie KI-Assistentin. 🤖"
    );

  }


  /*
    WAS KANNST DU?
  */

  if (message.includes("was kannst du")) {

    return `
Ich kann momentan:

• mit dir chatten
• mich an Nachrichten erinnern
• rechnen
• Datum und Uhrzeit nennen
• einfache Aufgaben erkennen
• Informationen aus unserem Gespräch verwenden

Und das ohne API-Key und ohne Abo. 🔒
`;

  }


  /*
    ZEIT
  */

  if (
    message.includes("uhrzeit") ||
    message.includes("wie spät")
  ) {

    const time =
      new Date().toLocaleTimeString(
        "de-DE",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    return "Es ist gerade " + time + " Uhr.";

  }


  /*
    DATUM
  */

  if (
    message.includes("datum") ||
    message.includes("welcher tag")
  ) {

    const date =
      new Date().toLocaleDateString(
        "de-DE",
        {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

    return "Heute ist " + date + ".";

  }


  /*
    RECHNEN
  */

  const result =
    calculate(message);

  if (result !== null) {

    return "Das Ergebnis ist " + result + ".";

  }


  /*
    DANKESCHÖN
  */

  if (
    message.includes("danke") ||
    message.includes("dankeschön")
  ) {

    return random([
      "Gerne! 😄",
      "Kein Problem!",
      "Immer gerne. 🤖"
    ]);

  }


  /*
    ABSCHIED
  */

  if (
    message.includes("tschüss") ||
    message.includes("bye")
  ) {

    return "Bis später! 👋";

  }


  /*
    ALLGEMEINE ANTWORT
  */

  return random([
    "Interessant. Erzähl mir mehr.",
    "Ich höre zu. Was genau meinst du?",
    "Okay. Lass uns darüber sprechen.",
    "Das klingt interessant. 🤔",
    "Erzähl mir etwas mehr darüber."
  ]);

}


/*
  NACHRICHT SENDEN
*/

function sendMessage() {

  const text =
    input.value.trim();

  if (!text) return;


  /*
    Nachricht speichern
  */

  memory.push({
    role: "user",
    content: text
  });


  /*
    Speicher begrenzen
  */

  if (memory.length > 50) {

    memory =
      memory.slice(-50);

  }


  localStorage.setItem(
    "nova_memory",
    JSON.stringify(memory)
  );


  addMessage(text, "user");

  input.value = "";


  /*
    Denken
  */

  const thinking =
    document.createElement("div");

  thinking.className =
    "message nova";

  thinking.textContent =
    "NOVA denkt nach...";

  chat.appendChild(thinking);


  setTimeout(() => {

    thinking.remove();

    const response =
      nova(text);

    addMessage(
      response,
      "nova"
    );

  }, 400);

}


/*
  Button
*/

send.addEventListener(
  "click",
  sendMessage
);


/*
  Enter
*/

input.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      sendMessage();
    }

  }
);

</script>

</body>
</html>
