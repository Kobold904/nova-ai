<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #202633;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .status {
      font-size: 12px;
      color: #7dffb2;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 16px;
      padding: 13px 16px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.5;
    }

    .user {
      margin-left: auto;
      background: #27344a;
    }

    .nova {
      margin-right: auto;
      background: #151b26;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #202633;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #303949;
      background: #111722;
      color: white;
      outline: none;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">NOVA</div>
      <div class="status">LOCAL MODE</div>
    </header>

    <main id="chat">
      <div class="message nova">
        Hello. I'm NOVA. 👋<br>
        Give me a thought, a task, or a question to work with.
      </div>
    </main>

    <div class="composer">
      <input
        id="input"
        type="text"
        placeholder="Message NOVA..."
        autocomplete="off"
      >
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function generateResponse(text) {
      const message = text.toLowerCase();

      if (message.includes("hallo") ||
          message.includes("hi") ||
          message.includes("hey")) {
        return "Hey! 👋 Ich bin NOVA. Was möchtest du machen?";
      }

      if (message.includes("wer bist du")) {
        return "Ich bin NOVA – deine persönliche KI.";
      }

      if (message.includes("wie geht")) {
        return "Mir geht's gut. Danke 😄 Was steht bei dir an?";
      }

      if (message.includes("hilfe")) {
        return "Klar. Sag mir einfach, wobei du Hilfe brauchst.";
      }

      if (message.includes("zeit")) {
        return "Die aktuelle Zeit kann ich in dieser lokalen Version noch nicht zuverlässig abrufen.";
      }

      return "Interessant. Erzähl mir mehr darüber.";
    }

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");

      input.value = "";

      setTimeout(() => {
        const response = generateResponse(text);
        addMessage(response, "nova");
      }, 500);
    }
  </script>

</body>
</html>
