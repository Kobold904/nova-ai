<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
  height: 100vh;
}

.app {
  max-width: 800px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  border-bottom: 1px solid #202633;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 4px;
}

.status {
  color: #7dffb2;
  font-size: 12px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  padding: 13px 16px;
  margin-bottom: 16px;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  margin-left: auto;
  background: #27344a;
}

.nova {
  background: #151b26;
}

.composer {
  display: flex;
  gap: 8px;
  padding: 15px;
  border-top: 1px solid #202633;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #303949;
  background: #111722;
  color: white;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 0 15px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#send {
  background: white;
  color: black;
}

#mic {
  background: #27344a;
  color: white;
}

#mic.listening {
  background: #7dffb2;
  color: #080b12;
}

button:active {
  transform: scale(.96);
}

@media (max-width: 600px) {
  .logo {
    font-size: 21px;
  }

  .message {
    max-width: 90%;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">NOVA</div>
  <div class="status" id="status">VOICE READY</div>
</header>

<main id="chat">

  <div class="message nova">
    Hallo. Ich bin NOVA. 👋

    Du kannst mir schreiben oder auf 🎙️ tippen und mit mir sprechen.
  </div>

</main>

<div class="composer">

  <button id="mic" title="Mit NOVA sprechen">🎙️</button>

  <input
    id="input"
    type="text"
    placeholder="Nachricht an NOVA..."
    autocomplete="off"
  >

  <button id="send">➤</button>

</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const status = document.getElementById("status");


/* =========================
   GEDÄCHTNIS
========================= */

let memory = JSON.parse(
  localStorage.getItem("nova_memory") || "[]"
);


/* =========================
   NACHRICHT ANZEIGEN
========================= */

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

}


/* =========================
   ZUFÄLLIGE ANTWORT
========================= */

function random(list) {

  return list[
    Math.floor(Math.random() * list.length)
  ];

}


/* =========================
   RECHNER
========================= */

function calculate(text) {

  let expression = text
    .replace(/was ist/gi, "")
    .replace(/berechne/gi, "")
    .replace(/rechne/gi, "")
    .replace(/=/g, "")
    .trim();

  if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
    return null;
  }

  try {

    const result =
      Function(
        '"use strict"; return (' +
        expression +
        ')'
      )();

    if (Number.isFinite(result)) {
      return result;
    }

  } catch {}

  return null;
}


/* =========================
   GEDÄCHTNIS
========================= */

function memoryAnswer(message) {

  if (
    message.includes("was habe ich gesagt") ||
    message.includes("erinnerst du dich") ||
    message.includes("was weißt du über mich")
  ) {

    const previous =
      memory
        .filter(x => x.role === "user")
        .slice(-5);

    if (!previous.length) {
      return "Ich habe noch keine Nachrichten von dir gespeichert.";
    }

    return (
      "Ich erinnere mich an:\n\n" +
      previous
        .map(x => "• " + x.content)
        .join("\n")
    );
  }

  return null;
}


/* =========================
   NOVA
========================= */

function nova(text) {

  const message =
    text.toLowerCase().trim();


  const remembered =
    memoryAnswer(message);

  if (remembered) {
    return remembered;
  }


  /* Begrüßung */

  if (
    /^(hallo|hi|hey|moin|servus)\b/.test(message)
  ) {

    return random([
      "Hey! 👋 Was machen wir?",
      "Hallo! Schön dich zu sehen.",
      "Hey! NOVA ist bereit. 🤖"
    ]);

  }


  /* Identität */

  if (
    message.includes("wer bist du") ||
    message.includes("was bist du")
  ) {

    return "Ich bin NOVA – deine persönliche KI-Assistentin. 🤖";

  }


  /* Fähigkeiten */

  if (message.includes("was kannst du")) {

    return `
Ich kann momentan:

• mit dir chatten
• mich an dein Gespräch erinnern
• rechnen
• Datum und Uhrzeit nennen
• mit deiner Stimme arbeiten
• meine Antworten vorlesen

Und das ohne API-Key und ohne Abo.
`;

  }


  /* Uhrzeit */

  if (
    message.includes("uhrzeit") ||
    message.includes("wie spät")
  ) {

    const time =
      new Date().toLocaleTimeString(
        "de-DE",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    return "Es ist gerade " + time + " Uhr.";

  }


  /* Datum */

  if (
    message.includes("datum") ||
    message.includes("welcher tag")
  ) {

    const date =
      new Date().toLocaleDateString(
        "de-DE",
        {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

    return "Heute ist " + date + ".";

  }


  /* Rechner */

  const result =
    calculate(message);

  if (result !== null) {

    return "Das Ergebnis ist " + result + ".";

  }


  /* Danke */

  if (
    message.includes("danke") ||
    message.includes("dankeschön")
  ) {

    return random([
      "Gerne! 😄",
      "Kein Problem.",
      "Immer gerne."
    ]);

  }


  /* Abschied */

  if (
    message.includes("tschüss") ||
    message.includes("bye")
  ) {

    return "Bis später! 👋";

  }


  return random([
    "Interessant. Erzähl mir mehr.",
    "Ich höre zu. Was genau meinst du?",
    "Okay. Lass uns darüber sprechen.",
    "Das klingt interessant. 🤔",
    "Erzähl mir etwas mehr darüber."
  ]);

}


/* =========================
   ANTWORT VORLESEN
========================= */

function speak(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  speechSynthesis.cancel();

  const cleanText =
    text
      .replace(/[•🧠🤖👋😄⚡🎙️]/g, "")
      .trim();

  const utterance =
    new SpeechSynthesisUtterance(cleanText);

  utterance.lang = "de-DE";

  utterance.rate = 0.95;

  utterance.pitch = 0.9;

  utterance.volume = 1;

  speechSynthesis.speak(utterance);

}


/* =========================
   NACHRICHT SENDEN
========================= */

function sendMessage() {

  const text =
    input.value.trim();

  if (!text) {
    return;
  }


  addMessage(text, "user");


  memory.push({
    role: "user",
    content: text
  });


  if (memory.length > 50) {
    memory = memory.slice(-50);
  }


  localStorage.setItem(
    "nova_memory",
    JSON.stringify(memory)
  );


  input.value = "";


  const thinking =
    document.createElement("div");

  thinking.className =
    "message nova";

  thinking.textContent =
    "NOVA denkt nach...";

  chat.appendChild(thinking);


  setTimeout(() => {

    thinking.remove();

    const response =
      nova(text);

    addMessage(
      response,
      "nova"
    );


    memory.push({
      role: "assistant",
      content: response
    });


    localStorage.setItem(
      "nova_memory",
      JSON.stringify(memory)
    );


    /* NOVA spricht */

    speak(response);

  }, 500);

}


/* =========================
   BUTTON
========================= */

send.addEventListener(
  "click",
  sendMessage
);


/* =========================
   ENTER
========================= */

input.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      sendMessage();
    }

  }
);


/* =========================
   SPRACHERKENNUNG
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  const recognition =
    new SpeechRecognition();

  recognition.lang = "de-DE";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;


  mic.addEventListener(
    "click",
    () => {

      try {

        recognition.start();

      } catch {}

    }
  );


  recognition.onstart = () => {

    mic.classList.add("listening");

    status.textContent =
      "LISTENING...";

  };


  recognition.onresult = event => {

    const text =
      event.results[0][0].transcript;

    input.value = text;

    sendMessage();

  };


  recognition.onerror = event => {

    console.log(
      "Speech error:",
      event.error
    );

    status.textContent =
      "VOICE READY";

    mic.classList.remove(
      "listening"
    );

  };


  recognition.onend = () => {

    mic.classList.remove(
      "listening"
    );

    status.textContent =
      "VOICE READY";

  };

} else {

  mic.disabled = true;

  mic.title =
    "Spracherkennung wird von diesem Browser nicht unterstützt";

  status.textContent =
    "VOICE OUTPUT READY";

}


/* =========================
   START
========================= */

input.focus();

</script>

</body>
</html>
