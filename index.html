<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #202633;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .status {
      font-size: 12px;
      color: #7dffb2;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 16px;
      padding: 13px 16px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #27344a;
    }

    .nova {
      margin-right: auto;
      background: #151b26;
    }

    .thinking {
      opacity: 0.6;
      font-style: italic;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #202633;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #303949;
      background: #111722;
      color: white;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 21px;
      }

      .message {
        max-width: 90%;
      }

      button {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">NOVA</div>
      <div class="status">LOCAL MODE</div>
    </header>

    <main id="chat">
      <div class="message nova">
        Hello. I'm NOVA. 👋
        Give me a thought, a task, or a question to work with.
      </div>
    </main>

    <div class="composer">
      <input
        id="input"
        type="text"
        placeholder="Message NOVA..."
        autocomplete="off"
      >

      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    // Simple memory for the current conversation
    const conversation = [];

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    function randomResponse(responses) {
      return responses[
        Math.floor(Math.random() * responses.length)
      ];
    }

    function calculate(text) {
      let expression = text
        .replace(/was ist/gi, "")
        .replace(/berechne/gi, "")
        .replace(/rechne/gi, "")
        .replace(/=/g, "")
        .trim();

      // Nur einfache mathematische Ausdrücke erlauben
      if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
        return null;
      }

      try {
        const result = Function(
          '"use strict"; return (' + expression + ')'
        )();

        if (Number.isFinite(result)) {
          return result;
        }
      } catch (error) {
        return null;
      }

      return null;
    }

    function generateResponse(text) {
      const message = text.toLowerCase().trim();

      // Begrüßungen
      if (/^(hallo|hi|hey|moin|servus)\b/.test(message)) {
        return randomResponse([
          "Hey! 👋 Was kann ich für dich tun?",
          "Hallo! Ich bin NOVA. Was steht an?",
          "Hey 👋 Schön, dass du da bist."
        ]);
      }

      // Name / Identität
      if (
        message.includes("wer bist du") ||
        message.includes("was bist du")
      ) {
        return "Ich bin NOVA – deine persönliche lokale KI. 🤖";
      }

      // Wie geht es dir?
      if (
        message.includes("wie geht es dir") ||
        message.includes("wie geht's dir") ||
        message.includes("wie gehts dir")
      ) {
        return randomResponse([
          "Mir geht's gut 😄 Was möchtest du machen?",
          "Alles läuft. 🤖 Was steht als Nächstes an?",
          "Bereit und aufmerksam. Was hast du vor?"
        ]);
      }

      // Uhrzeit
      if (
        message.includes("uhrzeit") ||
        message.includes("wie spät") ||
        message.includes("uhr")
      ) {
        const time = new Date().toLocaleTimeString("de-DE", {
          hour: "2-digit",
          minute: "2-digit"
        });

        return "Auf deinem Gerät ist es gerade " + time + " Uhr.";
      }

      // Datum
      if (
        message.includes("datum") ||
        message.includes("welcher tag") ||
        message.includes("welches datum")
      ) {
        const date = new Date().toLocaleDateString("de-DE", {
          weekday: "long",
          day: "2-digit",
          month: "long",
          year: "numeric"
        });

        return "Heute ist " + date + ".";
      }

      // Mathematik
      const result = calculate(message);

      if (result !== null) {
        return "Das Ergebnis ist " + result + ".";
      }

      // Hilfe
      if (message.includes("hilfe")) {
        return "Klar! Du kannst mich etwas fragen, eine Rechnung eingeben oder einfach mit mir chatten.";
      }

      // Danke
      if (
        message.includes("danke") ||
        message.includes("dankeschön")
      ) {
        return randomResponse([
          "Gerne! 😄",
          "Kein Problem!",
          "Immer gerne. 🤖"
        ]);
      }

      // Abschied
      if (
        message.includes("tschüss") ||
        message.includes("bye") ||
        message.includes("bis später")
      ) {
        return "Bis später! 👋";
      }

      // Einfache Fragen
      if (message.includes("was kannst du")) {
        return "Ich kann momentan einfache Fragen beantworten, rechnen, Datum und Uhrzeit erkennen und mich mit dir unterhalten. 🧠";
      }

      // Fallback
      return randomResponse([
        "Interessant. Erzähl mir mehr darüber.",
        "Ich höre zu. Was genau meinst du?",
        "Das ist interessant. 🤔 Erzähl mir etwas mehr.",
        "Okay. Lass uns darüber sprechen.",
        "Ich bin mir noch nicht ganz sicher, was du meinst. Kannst du es anders formulieren?"
      ]);
    }

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      // User message
      addMessage(text, "user");

      // Save conversation
      conversation.push({
        role: "user",
        content: text
      });

      input.value = "";

      // Thinking message
      const thinking = addMessage(
        "NOVA denkt nach...",
        "nova thinking"
      );

      setTimeout(() => {
        thinking.remove();

        const response = generateResponse(text);

        addMessage(response, "nova");

        conversation.push({
          role: "assistant",
          content: response
        });

      }, 500);
    }
  </script>

</body>
</html>
