<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
  height: 100vh;
}

.app {
  max-width: 800px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  border-bottom: 1px solid #202633;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 4px;
}

.status {
  color: #7dffb2;
  font-size: 12px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  padding: 13px 16px;
  margin-bottom: 16px;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  margin-left: auto;
  background: #27344a;
}

.nova {
  background: #151b26;
}

.composer {
  display: flex;
  gap: 8px;
  padding: 15px;
  border-top: 1px solid #202633;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #303949;
  background: #111722;
  color: white;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 0 15px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#send {
  background: white;
  color: black;
}

#mic {
  background: #27344a;
  color: white;
}

#mic.listening {
  background: #7dffb2;
  color: #080b12;
}

button:active {
  transform: scale(.96);
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">NOVA</div>
  <div class="status" id="status">ONLINE</div>
</header>

<main id="chat">

  <div class="message nova">
    Hallo. Ich bin NOVA. 👋

    Was möchtest du wissen?
  </div>

</main>

<div class="composer">

  <button id="mic" title="Mit NOVA sprechen">🎙️</button>

  <input
    id="input"
    type="text"
    placeholder="Nachricht an NOVA..."
    autocomplete="off"
  >

  <button id="send">➤</button>

</div>

</div>

<script>

const WORKER_URL =
  "https://weathered-term-6500.nie-butan-9x.workers.dev/";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const status = document.getElementById("status");


/* =========================
   CHAT
========================= */

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className =
    "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   NOVA FRAGEN
========================= */

async function askNova(text) {

  const response =
    await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });


  if (!response.ok) {
    throw new Error(
      "Worker antwortet nicht."
    );
  }


  const data =
    await response.json();


  if (data.error) {
    throw new Error(data.error);
  }


  return data.reply;
}


/* =========================
   NACHRICHT SENDEN
========================= */

async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) {
    return;
  }


  addMessage(
    text,
    "user"
  );


  input.value = "";


  status.textContent =
    "THINKING...";


  const thinking =
    document.createElement("div");

  thinking.className =
    "message nova";

  thinking.textContent =
    "NOVA denkt nach...";

  chat.appendChild(
    thinking
  );


  try {

    const response =
      await askNova(text);


    thinking.remove();


    addMessage(
      response,
      "nova"
    );


    speak(response);


  } catch (error) {

    thinking.remove();


    addMessage(
      "Verbindung zu NOVA konnte nicht hergestellt werden.",
      "nova"
    );

    console.error(error);

  }


  status.textContent =
    "ONLINE";
}


/* =========================
   VORLESEN
========================= */

function speak(text) {

  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "de-DE";

  utterance.rate =
    0.95;

  utterance.pitch =
    0.9;


  speechSynthesis.speak(
    utterance
  );
}


/* =========================
   BUTTON
========================= */

send.addEventListener(
  "click",
  sendMessage
);


/* =========================
   ENTER
========================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      sendMessage();

    }

  }
);


/* =========================
   SPRACHEINGABE
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "de-DE";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  mic.addEventListener(
    "click",
    () => {

      try {

        recognition.start();

      } catch {}

    }
  );


  recognition.onstart =
    () => {

      mic.classList.add(
        "listening"
      );

      status.textContent =
        "LISTENING...";

    };


  recognition.onresult =
    event => {

      const text =
        event.results[0][0]
          .transcript;

      input.value =
        text;

      sendMessage();

    };


  recognition.onerror =
    () => {

      mic.classList.remove(
        "listening"
      );

      status.textContent =
        "ONLINE";

    };


  recognition.onend =
    () => {

      mic.classList.remove(
        "listening"
      );

      status.textContent =
        "ONLINE";

    };

}


input.focus();

</script>

</body>
</html>
