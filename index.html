<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #202633;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .status {
      font-size: 12px;
      color: #7dffb2;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 16px;
      padding: 13px 16px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #27344a;
    }

    .nova {
      margin-right: auto;
      background: #151b26;
    }

    .thinking {
      opacity: 0.6;
      font-style: italic;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #202633;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #303949;
      background: #111722;
      color: white;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 21px;
      }

      .message {
        max-width: 90%;
      }

      button {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">NOVA</div>
    <div class="status">LOCAL MODE</div>
  </header>

  <main id="chat">

    <div class="message nova">
      Hello. I'm NOVA. 👋
      Give me a thought, a task, or a question to work with.
    </div>

  </main>

  <div class="composer">

    <input
      id="input"
      type="text"
      placeholder="Message NOVA..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">Send</button>

  </div>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");

/*
  NOVA MEMORY
  Stores the current conversation.
*/

let memory = [];


/* ENTER TO SEND */

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});


/* ADD MESSAGE */

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;

}


/* RANDOM RESPONSE */

function randomResponse(list) {

  return list[
    Math.floor(Math.random() * list.length)
  ];

}


/* SIMPLE CALCULATOR */

function calculate(text) {

  let expression = text
    .replace(/was ist/gi, "")
    .replace(/berechne/gi, "")
    .replace(/rechne/gi, "")
    .replace(/=/g, "")
    .trim();

  if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
    return null;
  }

  try {

    const result = Function(
      '"use strict"; return (' + expression + ')'
    )();

    if (Number.isFinite(result)) {
      return result;
    }

  } catch (error) {}

  return null;

}


/* MEMORY DETECTION */

function checkMemory(message) {

  /*
    Check what NOVA remembers.
  */

  if (
    message.includes("was habe ich gesagt") ||
    message.includes("was weißt du über mich") ||
    message.includes("erinnerst du dich")
  ) {

    if (memory.length === 0) {
      return "Noch nicht. Unser Gespräch hat gerade erst begonnen.";
    }

    const userMessages = memory
      .filter(item => item.role === "user")
      .map(item => item.content);

    if (userMessages.length === 0) {
      return "Du hast mir bisher noch nichts erzählt.";
    }

    return "Ich erinnere mich an unser Gespräch. Deine bisherigen Nachrichten waren unter anderem: " +
      userMessages.slice(-3).join(" | ");

  }

  return null;

}


/* MAIN AI LOGIC */

function generateResponse(text) {

  const message = text.toLowerCase().trim();


  /* MEMORY */

  const memoryResponse = checkMemory(message);

  if (memoryResponse) {
    return memoryResponse;
  }


  /* GREETING */

  if (/^(hallo|hi|hey|moin|servus)\b/.test(message)) {

    return randomResponse([

      "Hey! 👋 Was kann ich für dich tun?",

      "Hallo! Ich bin NOVA. Was steht an?",

      "Hey 👋 Schön, dass du da bist."

    ]);

  }


  /* IDENTITY */

  if (
    message.includes("wer bist du") ||
    message.includes("was bist du")
  ) {

    return "Ich bin NOVA – deine persönliche lokale KI. 🤖";

  }


  /* HOW ARE YOU */

  if (
    message.includes("wie geht es dir") ||
    message.includes("wie geht's dir") ||
    message.includes("wie gehts dir")
  ) {

    return randomResponse([

      "Mir geht's gut 😄 Was möchtest du machen?",

      "Alles läuft. 🤖 Was steht als Nächstes an?",

      "Bereit und aufmerksam. Was hast du vor?"

    ]);

  }


  /* TIME */

  if (
    message.includes("uhrzeit") ||
    message.includes("wie spät") ||
    message.includes("uhr")
  ) {

    const time = new Date().toLocaleTimeString(
      "de-DE",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

    return "Auf deinem Gerät ist es gerade " + time + " Uhr.";

  }


  /* DATE */

  if (
    message.includes("datum") ||
    message.includes("welcher tag") ||
    message.includes("welches datum")
  ) {

    const date = new Date().toLocaleDateString(
      "de-DE",
      {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );

    return "Heute ist " + date + ".";

  }


  /* CALCULATOR */

  const result = calculate(message);

  if (result !== null) {

    return "Das Ergebnis ist " + result + ".";

  }


  /* WHAT CAN YOU DO */

  if (message.includes("was kannst du")) {

    return `
Ich kann momentan:

• Fragen erkennen
• rechnen
• Datum und Uhrzeit nennen
• mich an Teile unseres aktuellen Chats erinnern
• verschiedene Antworten geben
• einfache Gespräche führen

Ich bin noch eine lokale KI und werde gerade weiterentwickelt. 🧠
`;

  }


  /* HELP */

  if (message.includes("hilfe")) {

    return "Klar! Frag mich einfach etwas oder erzähl mir, was du machen möchtest.";

  }


  /* THANK YOU */

  if (
    message.includes("danke") ||
    message.includes("dankeschön")
  ) {

    return randomResponse([

      "Gerne! 😄",

      "Kein Problem!",

      "Immer gerne. 🤖"

    ]);

  }


  /* GOODBYE */

  if (
    message.includes("tschüss") ||
    message.includes("bye") ||
    message.includes("bis später")
  ) {

    return "Bis später! 👋";

  }


  /* FALLBACK */

  return randomResponse([

    "Interessant. Erzähl mir mehr darüber.",

    "Ich höre zu. Was genau meinst du?",

    "Das ist interessant. 🤔 Erzähl mir etwas mehr.",

    "Okay. Lass uns darüber sprechen.",

    "Ich bin mir noch nicht ganz sicher, was du meinst. Kannst du es anders formulieren?"

  ]);

}


/* SEND MESSAGE */

function sendMessage() {

  const text = input.value.trim();

  if (!text) return;


  /* SAVE USER MESSAGE */

  memory.push({

    role: "user",

    content: text

  });


  addMessage(text, "user");


  input.value = "";


  /* THINKING */

  const thinking = addMessage(

    "NOVA denkt nach...",

    "nova thinking"

  );


  setTimeout(function() {

    thinking.remove();


    const response = generateResponse(text);


    /* SAVE NOVA RESPONSE */

    memory.push({

      role: "assistant",

      content: response

    });


    addMessage(response, "nova");

  }, 500);

}

</script>

</body>
</html>
