<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif;height:100vh}
.app{height:100vh;max-width:800px;margin:auto;display:flex;flex-direction:column}
header{padding:18px 20px;border-bottom:1px solid #202633;display:flex;justify-content:space-between}
.logo{font-size:25px;font-weight:bold;letter-spacing:4px}
.status{color:#7dffb2;font-size:12px}
#chat{flex:1;overflow-y:auto;padding:20px}
.message{max-width:85%;padding:13px 16px;margin-bottom:14px;border-radius:15px;line-height:1.5;white-space:pre-wrap}
.nova{background:#151b26}
.user{background:#27344a;margin-left:auto}
.composer{display:flex;gap:8px;padding:15px;border-top:1px solid #202633}
input{flex:1;padding:14px;border-radius:12px;border:1px solid #303949;background:#111722;color:#fff;font-size:16px}
button{border:0;border-radius:12px;padding:0 16px;font-size:18px;cursor:pointer}
#send{background:#fff;color:#000}
</style>
</head>

<body>
<div class="app">

<header>
<div class="logo">NOVA</div>
<div class="status" id="status">ONLINE</div>
</header>

<main id="chat">
<div class="message nova">Hallo 👋<br><br>Ich bin NOVA. Schreib mir etwas.</div>
</main>

<div class="composer">
<input id="input" placeholder="Nachricht an NOVA..." autocomplete="off">
<button id="send">➤</button>
</div>

</div>

<script>
const API="https://nova-api.nie-butan-9x.workers.dev/";
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
const status=document.getElementById("status");

function addMessage(text,type){
  const el=document.createElement("div");
  el.className="message "+type;
  el.textContent=text;
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
  return el;
}

async function sendMessage(){
  const text=input.value.trim();
  if(!text)return;

  addMessage(text,"user");
  input.value="";
  send.disabled=true;
  status.textContent="DENKT...";

  const reply=addMessage("","nova");

  try{
    const r=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });

    if(!r.ok)throw new Error("Serverfehler");

    const reader=r.body.getReader();
    const decoder=new TextDecoder();
    let buffer="";

    while(true){
      const {value,done}=await reader.read();
      if(done)break;

      buffer+=decoder.decode(value,{stream:true});

      const lines=buffer.split("\n");
      buffer=lines.pop();

      for(const line of lines){
        if(!line.startsWith("data:"))continue;

        const raw=line.slice(5).trim();
        if(!raw)continue;

        try{
          const data=JSON.parse(raw);
          const text=data.candidates?.[0]?.content?.parts?.[0]?.text;

          if(text){
            reply.textContent+=text;
            chat.scrollTop=chat.scrollHeight;
          }
        }catch{}
      }
    }

  }catch(error){
    reply.textContent="Fehler: "+error.message;
  }

  status.textContent="ONLINE";
  send.disabled=false;
  input.focus();
}

send.onclick=sendMessage;

input.addEventListener("keydown",e=>{
  if(e.key==="Enter")sendMessage();
});

input.focus();
</script>
</body>
</html>
