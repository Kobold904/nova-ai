<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
  height: 100vh;
}

.app {
  max-width: 800px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  border-bottom: 1px solid #202633;
  display: flex;
  justify-content: space-between;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 4px;
}

.status {
  font-size: 12px;
  color: #7dffb2;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  padding: 13px 16px;
  margin-bottom: 16px;
  border-radius: 15px;
  max-width: 85%;
  white-space: pre-wrap;
  line-height: 1.5;
}

.user {
  margin-left: auto;
  background: #27344a;
}

.nova {
  background: #151b26;
}

.composer {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #202633;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #303949;
  background: #111722;
  color: white;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 0 18px;
  font-weight: bold;
}

button:disabled,
input:disabled {
  opacity: .5;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">NOVA</div>
  <div class="status" id="status">STARTING...</div>
</header>

<main id="chat">
  <div class="message nova">
    NOVA wird gestartet... 🤖
  </div>
</main>

<div class="composer">
  <input id="input" placeholder="Message NOVA..." disabled>
  <button id="send" disabled>Send</button>
</div>

</div>

<script type="module">

import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const status = document.getElementById("status");

let ai = null;
let messages = [];

function addMessage(text, type) {
  const el = document.createElement("div");
  el.className = "message " + type;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

async function loadModel() {

  addMessage(
    "Ich lade ein kleines lokales KI-Modell. Beim ersten Start kann der Download einige Zeit dauern.",
    "nova"
  );

  try {

    status.textContent = "GPU TEST...";

    /*
      Zuerst versuchen wir WebGPU.
    */

    if ("gpu" in navigator) {

      try {

        ai = await pipeline(
          "text-generation",
          "onnx-community/Qwen2.5-0.5B-Instruct",
          {
            device: "webgpu",
            dtype: "q4f16"
          }
        );

        status.textContent = "LOCAL GPU AI";

        addMessage(
          "KI bereit. 🧠⚡",
          "nova"
        );

        enableChat();
        return;

      } catch (gpuError) {

        console.log("WebGPU failed:", gpuError);

      }

    }

    /*
      Wenn WebGPU nicht funktioniert,
      versuchen wir CPU/WASM.
    */

    status.textContent = "CPU MODE...";

    ai = await pipeline(
      "text-generation",
      "onnx-community/Qwen2.5-0.5B-Instruct",
      {
        device: "wasm",
        dtype: "q4f16"
      }
    );

    status.textContent = "LOCAL CPU AI";

    addMessage(
      "KI bereit. 🧠\nCPU-Modus ist aktiv und kann langsamer sein.",
      "nova"
    );

    enableChat();

  } catch (error) {

    console.error(error);

    status.textContent = "AI ERROR";

    addMessage(
      "Das Modell konnte nicht geladen werden.\n\n" +
      "Fehler: " + error.message,
      "nova"
    );
  }
}

function enableChat() {
  input.disabled = false;
  send.disabled = false;
  input.focus();
}

async function generate(text) {

  messages.push({
    role: "user",
    content: text
  });

  const recent = messages.slice(-6);

  const prompt = [
    {
      role: "system",
      content:
        "Du bist NOVA, eine freundliche persönliche KI. " +
        "Antworte auf Deutsch, außer der Benutzer bittet um eine andere Sprache. " +
        "Sei hilfreich und verständlich."
    },
    ...recent
  ];

  const result = await ai(
    prompt,
    {
      max_new_tokens: 120,
      temperature: 0.7,
      do_sample: true
    }
  );

  let answer = result[0].generated_text;

  if (Array.isArray(answer)) {
    answer = answer[answer.length - 1].content;
  }

  answer = String(answer)
    .replace(/<\|im_end\|>/g, "")
    .trim();

  messages.push({
    role: "assistant",
    content: answer
  });

  return answer;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text || !ai) return;

  addMessage(text, "user");

  input.value = "";
  input.disabled = true;
  send.disabled = true;

  const thinking = addMessage(
    "NOVA denkt nach...",
    "nova"
  );

  try {

    const answer = await generate(text);

    thinking.remove();

    addMessage(answer, "nova");

  } catch (error) {

    thinking.remove();

    addMessage(
      "Fehler beim Antworten: " + error.message,
      "nova"
    );

  }

  input.disabled = false;
  send.disabled = false;
  input.focus();
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    sendMessage();
  }
});

loadModel();

</script>

</body>
</html>
