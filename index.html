<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #202633;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .status {
      font-size: 12px;
      color: #7dffb2;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 16px;
      padding: 13px 16px;
      border-radius: 15px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #27344a;
    }

    .nova {
      margin-right: auto;
      background: #151b26;
    }

    .thinking {
      opacity: 0.6;
      font-style: italic;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #202633;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #303949;
      background: #111722;
      color: white;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 21px;
      }

      .message {
        max-width: 90%;
      }

      button {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">NOVA</div>
    <div class="status" id="status">LOADING AI...</div>
  </header>

  <main id="chat">

    <div class="message nova">
      NOVA wird gestartet... 🤖
    </div>

  </main>

  <div class="composer">

    <input
      id="input"
      type="text"
      placeholder="Warte auf NOVA..."
      autocomplete="off"
      disabled
    >

    <button id="sendButton" onclick="sendMessage()" disabled>
      Send
    </button>

  </div>

</div>

<script type="module">

import { pipeline } from
  "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");
const status = document.getElementById("status");


let generator = null;

let conversation = [];


/*
  Add message to chat
*/

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}


/*
  Load the actual AI model
*/

async function loadAI() {

  try {

    status.textContent = "LOADING AI...";

    addMessage(
      "Ich lade gerade mein KI-Modell. Das kann beim ersten Start etwas dauern...",
      "nova"
    );


    /*
      Qwen2.5 0.5B Instruct
      4-bit quantized
    */

    generator = await pipeline(
      "text-generation",
      "onnx-community/Qwen2.5-0.5B-Instruct",
      {
        device: "webgpu",
        dtype: "q4"
      }
    );


    status.textContent = "AI READY";

    input.disabled = false;
    sendButton.disabled = false;

    input.placeholder = "Message NOVA...";

    addMessage(
      "Ich bin bereit. 🧠\nDu kannst jetzt mit dem echten lokalen KI-Modell chatten.",
      "nova"
    );

  } catch (error) {

    console.error(error);

    status.textContent = "AI ERROR";

    addMessage(
      "Das KI-Modell konnte auf diesem Gerät nicht gestartet werden.\n\n" +
      "Möglicherweise unterstützt der Browser WebGPU nicht oder das Modell ist für dieses Gerät zu groß.\n\n" +
      "Fehler: " + error.message,
      "nova"
    );

  }

}


/*
  Generate AI response
*/

async function generateAIResponse(userText) {

  conversation.push({
    role: "user",
    content: userText
  });


  /*
    Keep the conversation reasonably small
    so the iPhone does not have to process
    an enormous amount of text.
  */

  const recentConversation =
    conversation.slice(-8);


  const messages = [

    {
      role: "system",
      content:
        "You are NOVA, a friendly personal AI assistant. " +
        "Answer naturally and clearly. " +
        "The user speaks German, so answer in German unless asked otherwise."
    },

    ...recentConversation

  ];


  /*
    Convert chat messages into the model's
    expected prompt format.
  */

  const prompt =
    generator.tokenizer.apply_chat_template(
      messages,
      {
        tokenize: false,
        add_generation_prompt: true
      }
    );


  const result = await generator(
    prompt,
    {
      max_new_tokens: 180,
      temperature: 0.7,
      do_sample: true,
      return_full_text: false
    }
  );


  let answer = result[0].generated_text;


  /*
    Clean up possible special tokens.
  */

  answer = answer
    .replace(/<\|im_end\|>/g, "")
    .replace(/<\|endoftext\|>/g, "")
    .trim();


  conversation.push({
    role: "assistant",
    content: answer
  });


  return answer;

}


/*
  Send message
*/

async function sendMessage() {

  const text = input.value.trim();

  if (!text || !generator) {
    return;
  }


  addMessage(text, "user");

  input.value = "";

  input.disabled = true;
  sendButton.disabled = true;


  const thinking =
    addMessage(
      "NOVA denkt nach...",
      "nova thinking"
    );


  try {

    const response =
      await generateAIResponse(text);


    thinking.remove();

    addMessage(
      response,
      "nova"
    );

  } catch (error) {

    thinking.remove();

    addMessage(
      "Beim Generieren der Antwort ist ein Fehler aufgetreten:\n" +
      error.message,
      "nova"
    );

    console.error(error);

  }


  input.disabled = false;
  sendButton.disabled = false;

  input.focus();

}


/*
  Enter = send
*/

input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      sendMessage();

    }

  }
);


/*
  Start NOVA
*/

loadAI();

</script>

</body>
</html>
